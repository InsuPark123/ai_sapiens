policy_action_transition:
  enabled: true
  duration: 0.1

policy_asset_roots:
  - ../assets/k1
  - ../assets/k1_kpop
  - ../assets/k1_taekwondo

mimic_defaults:
  fps: 50
  time_start: 0.0
  time_end: auto
  on_complete: Velocity

authority:
  api_entry:
    warmup_duration: 3.0
    velocity_neutral_threshold: 0.05
    allowed_from_states:
      - Damping
      - ReadyPose
      - Velocity
  default_velocity_state: Velocity

teleop_input:
  plugin: ai_sapiens_sim2real/RadiomasterPocketTeleopInputPlugin
  config: teleop/radiomaster_pocket.yaml
  vel_command_timeout: 0.2
  timeout: 0.2

group:
  enabled: true
  plugin: ai_sapiens_sim2real/RadiomasterPocketTeleopInputPlugin
  config: teleop/radiomaster_group.yaml
  timeout: 0.2
  vel_command_timeout: 0.2

teleop_conditions:
  DampingRequested:
    input_code: 1
  ReadyPoseRequested:
    input_code: 2
  VelocityRequested:
    input_code: 3
  MimicRequested:
    input_code: 4

