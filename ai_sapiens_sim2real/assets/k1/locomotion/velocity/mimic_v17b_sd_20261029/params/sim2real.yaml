      - clips/texas_comp.csv
      - clips/spiderman.csv
      - clips/sit_on_heels.csv
      - clips/ironman_pose.csv
      - clips/sitting_floor.csv
      - clips/lying_side.csv
      clip_names:
      - bow_navel
      - motifect_taunt_mock_bow
      - wave_right_hand_only
      - wave_two_hand
      - dance1
      - dance2
      - bye_bye_salute
      - kissing_hands_thanks
      - present_left
      - boss_dust_brushing
      - bravo
      - triumphant_delight
      - looking_around
      - six_seven_three
      - come_here
      - shake_hands
      - shake_hands_fake
      - inducing_response
      - texas_comp
      - spiderman
      - sit_on_heels
      - ironman_pose
      - sitting_floor
      - lying_side
      fps: 50.0
      quiet_seconds: 0.7
      pending_timeout_seconds: 2.5
      ramp_seconds: 0.5
      bridge_min_seconds: 0.5
      bridge_max_seconds: 1.2
      bridge_joint_speed: 1.2
      bridge_torso_speed: 0.1
      abort_max_reference_tilt: 0.5
      acceleration_limits:
      - 1.0
      - 1.0
      - 1.5
      quiet_command: 0.1
      quiet_leg_speed: 0.35
      quiet_ang_speed: 0.35
      # 2026-10-13 걷는 중 켜면 팔만 사용(다리는 보행 정책), 서서 켜면 원래 동작 전체
      # 2026-10-13 다이얼표 (270+순서): shake_hands_fake는 다이얼에서 빼고 악수 분기로만 사용, 286 = inducing_response
      # 2026-10-22 v10: 287 = texas_comp, 288 = spiderman (대기 클립); 2026-10-23 v11: 289 = sit_on_heels (앉아서 대기 / 일어나기)
      dial_clips: [bow_navel, motifect_taunt_mock_bow, wave_right_hand_only, wave_two_hand, dance1, dance2, bye_bye_salute,
                   kissing_hands_thanks, present_left, boss_dust_brushing, bravo, triumphant_delight, looking_around,
                   six_seven_three, come_here, shake_hands, inducing_response, texas_comp, spiderman,
                   sit_on_heels]
      # 2026-10-23 인사 반복 칸 복원 (v8의 217 반복을 v11에 이식): dial_base + len(dial_clips) = 290. SA 켜면 아래 순서로 무한 반복,
      # SA 끄면 지금 하던 동작을 끝까지 하고 멈춤 (다음 동작 준비 중이면 바로 멈춤)
      dial_loops:
      - [wave_right_hand_only, wave_two_hand, kissing_hands_thanks]
      # 2026-10-23 v12: 291 = ironman_pose (반복 칸 1개짜리 대기 클립): SA 올림 -> 점프 후 무릎 꿇고 손 짚고 대기 (2026-10-26 v13: final_v6, 114프레임),
      # SA 내림 -> 일어나기 후 멈춤 (런타임 패치 10), SD(CH8) 뒤집기 -> 일어나기 (SA 올린 채면 다시 반복)
      - [ironman_pose]
      # 2026-10-26 v13: 292 = sitting_floor (반복 칸 1개짜리 대기 클립): SA 올림 -> 바닥에 앉아 대기 (209프레임),
      # SA 내림 -> 일어나기 후 멈춤, SD(CH8) 뒤집기 -> 일어나기 (291 ironman_pose와 같은 방식)
      - [sitting_floor]
      # 2026-10-28 v17b: 293 = lying_side (반복 칸 1개짜리 대기 클립): SA 올림 -> 옆으로 누워 대기 (299프레임),
      # SA 내림 -> 일어나기 후 멈춤, SD(CH8) 뒤집기 -> 일어나기 (292 sitting_floor와 같은 방식)
      - [lying_side]
      # 2026-10-13 빠른 시작: 서 있어도 정지확인 0.7초를 기다리지 않고, 동작 진입 0.25초 (SA→손 움직임 1.84→0.9초, 시뮬)
      fast_start_clips: [shake_hands]
      fast_start_ramp_seconds: 0.25
      # 2026-10-13 서서 켠 동작도 스틱을 움직이면 걷기 전환(팔=동작, 다리=보행정책, 다리 넘김 0.4초)
      switch_walk_seconds: 0.4
      walk_clips: [wave_right_hand_only, wave_two_hand, bye_bye_salute, kissing_hands_thanks, present_left, bravo,
                   six_seven_three, come_here, shake_hands, shake_hands_fake]
      arms_only_ref_clips: [bye_bye_salute, kissing_hands_thanks, present_left, bravo, six_seven_three, come_here,
                            shake_hands, shake_hands_fake]
      # 2026-10-13 악수: 2.0초(100프레임)에서 손 내밀고 대기 -> SD(CH8) 뒤집기, CH10 <= 1250us 페이크(2.5초부터), >= 1750us 악수 계속
      interactive:
        clip: shake_hands
        hold_frame: 100
        low_clip: shake_hands_fake
        low_frame: 125
        select_channel: 10
        select_low_max_us: 1250
        select_high_min_us: 1750
        confirm_channel: 8
      # 2026-10-22 대기 클립 (런타임 패치 6): SA 올림 -> 대기 프레임까지 재생 후 대기 (texas: 근육 포즈 7.2초, spiderman: 런지 4.5초),
      # SA 내림 -> 대기 없이 끝까지 (일어나기) 재생 후 보행, SD(CH8) 뒤집기 -> 다음 구간, 대기 최대 hold_max_seconds 후 자동 진행
      # 2026-10-23 sit_on_heels: 앉은 자세 (384프레임)에서 대기, SA 내림 -> 일어나기
      hold_clips:
        texas_comp: [360]
        spiderman: [226]
        sit_on_heels: [384]
        ironman_pose: [114]
        sitting_floor: [209]
        lying_side: [299]
      # 2026-10-23 사용자: 대기 무한 (런타임 패치 9, 0 = 자동 진행 없음) -> SA 내림(끝까지 일어나기) 또는 SD(CH8) 뒤집기로만 진행
      hold_max_seconds: 0.0
deployment_metadata:
  source: walk_stable_amp_1 (checkpoints/walk_stable_amp_1) + mimic student v17b
  input_layout: term-major history (walk part); walk policy internally permutes to
    time-major
  history_length: 5
  single_frame_dim: 78
  observation_dim: 539
  action_dim: 23
  normalization: none in the ONNX; the walk obs scales are in observations.*.scale
  raw_action_limit: 10.0
  mimic_student_checkpoint: logs/rsl_rl/k1_hangang_mimic_student/2026-10-27_18-33-18_dagger_v17b_wsa1/model_1000.pt
  mimic_w_index: 514
