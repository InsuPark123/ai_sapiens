    clip: null
    history_length: 1
    params:
      trigger_channel: 8
      trigger_on_min_us: 1950
      trigger_on_max_us: 2050
      abort_on_release: true
      dial_base: 270
      clips:
      - clips/bow_navel.csv
      - clips/motifect_taunt_mock_bow.csv
      - clips/wave_right_hand_only.csv
      - clips/wave_two_hand.csv
      - clips/dance1.csv
      - clips/dance2.csv
      - clips/bye_bye_salute.csv
      - clips/kissing_hands_thanks.csv
      - clips/present_left.csv
      - clips/boss_dust_brushing.csv
