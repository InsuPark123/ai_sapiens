robot_joint_order:  # Corresponds to ai_sapiens_bringup/config/k1_rev1/k1_rev1_controllers.yaml.
- left_hip_pitch_joint
- left_hip_roll_joint
- left_hip_yaw_joint
- left_knee_joint
- left_ankle_pitch_joint
- left_ankle_roll_joint
- right_hip_pitch_joint
- right_hip_roll_joint
- right_hip_yaw_joint
- right_knee_joint
- right_ankle_pitch_joint
- right_ankle_roll_joint
- waist_yaw_joint
- left_shoulder_pitch_joint
- left_shoulder_roll_joint
- left_shoulder_yaw_joint
- left_elbow_joint
- left_wrist_roll_joint
- right_shoulder_pitch_joint
- right_shoulder_roll_joint
- right_shoulder_yaw_joint
- right_elbow_joint
- right_wrist_roll_joint

policy_action_transition:
  enabled: true
  duration: 0.1

policy_asset_roots:
  - ../assets/k1

mimic_defaults:
  fps: 50
  time_start: 0.0
  time_end: auto
  on_complete: Velocity

authority:
  api_entry:
    warmup_duration: 3.0
    velocity_neutral_threshold: 0.05
    allowed_from_states:
      - Damping
      - ReadyPose
      - Velocity
  default_velocity_state: Velocity

teleop_input:
  plugin: ai_sapiens_sim2real/RadiomasterPocketTeleopInputPlugin
  config: teleop/radiomaster_pocket.yaml
  vel_command_timeout: 0.2
  timeout: 0.2

teleop_conditions:
  DampingRequested:
    input_code: 1
  ReadyPoseRequested:
    input_code: 2
  VelocityRequested:
    input_code: 3
  MimicRequested:
    input_code: 4

selectors:
  mimic_selector:
    table:
      200: MimicWaveOneHand
      201: MimicWaveRightHandOnly
      202: MimicWaveTwoHand
      203: MimicWaveOneHandWaistYaw
      204: MimicWaveRightHandOnlyWaistYaw
      205: MimicWaveTwoHandWaistYaw
      206: MimicWaveOneHandWaistYawLarge
      207: MimicWaveRightHandOnlyWaistYawLarge
      208: MimicWaveTwoHandWaistYawLarge
      209: MimicMotifectTauntMockBow
      210: MimicSquat
      211: MimicBowNavel
      212: MimicCoinPickNewton
      213: MimicBoxingNewton
      214: MimicRedredNewton
      # 215: MimicLemonade
      216: MimicJumpNewton
      217: MimicDance1
      218: MimicDance2
      219: MimicTurn
      220: MimicFlower3
      221: SubVelocityTerrain


state_machine:
  initial: Damping
  states:
    Damping:
      run: damping
      transitions:
        - when: ReadyPoseRequested
          to: ReadyPose
    ReadyPose:
      run: ready_pose
      transitions:
        - when: DampingRequested
          to: Damping
        - when: VelocityRequested
          to: Velocity
        - when: MimicRequested
          select: mimic_selector
    ZeroPose:
      run: posture_zero_pose
      transitions:
        - when: DampingRequested
          to: Damping
        - when: ReadyPoseRequested
          to: ReadyPose
        - when: VelocityRequested
          to: Velocity
        - when: MimicRequested
          select: mimic_selector
    Velocity:
      # run: velocity_policy_amp_hangang
      run: velocity_policy_amp_hangang_limited
      # run: velocity_policy_woojin_amp_mjlab_k1_head_safe_50000
      # run: velocity_policy_walk_terrain
      transitions:
        - when: DampingRequested
          to: Damping
        - when: ReadyPoseRequested
          to: ReadyPose
        - when: MimicRequested
          trigger: edge
          select: mimic_selector

    SubVelocityTerrain:
      run: velocity_policy_walk_terrain
      transitions:
        - when: DampingRequested
          to: Damping
        - when: ReadyPoseRequested
          to: ReadyPose
        - when: VelocityRequested
          to: Velocity

    Mimic:
      abstract: true
      transitions:
        - when: DampingRequested
          to: Damping
        - when: ReadyPoseRequested
          to: ReadyPose
        - when: VelocityRequested
          to: Velocity
    MimicDance1:
      parent: Mimic
      run: mimic_dance1
    MimicDance2:
      parent: Mimic
      run: mimic_dance2
    MimicJumpNewton:
      parent: Mimic
      run: mimic_jump_newton
    MimicRedredNewton:
      parent: Mimic
      run: mimic_redred_newton
    MimicSquat:
      parent: Mimic
      run: mimic_squat
    MimicCoinPickNewton:
      parent: Mimic
      run: mimic_coin_pick_newton
    MimicBoxingNewton:
      parent: Mimic
      run: mimic_boxing_newton
    MimicBowNavel:
      parent: Mimic
      run: mimic_bow_navel
    MimicLemonade:
      parent: Mimic
      run: mimic_lemonade
    MimicTurn:
      parent: Mimic
      run: mimic_turn
    MimicFlower3:
      parent: Mimic
      run: flower3
    MimicWaveOneHand:
      parent: Mimic
      run: mimic_wave_one_hand
    MimicWaveTwoHand:
      parent: Mimic
      run: mimic_wave_two_hand
    MimicWaveRightHandOnly:
      parent: Mimic
      run: mimic_wave_right_hand_only
    MimicWaveOneHandWaistYaw:
      parent: Mimic
      run: mimic_wave_one_hand_waist_yaw
    MimicWaveRightHandOnlyWaistYaw:
      parent: Mimic
      run: mimic_wave_right_hand_only_waist_yaw
    MimicWaveTwoHandWaistYaw:
      parent: Mimic
      run: mimic_wave_two_hand_waist_yaw
    MimicWaveOneHandWaistYawLarge:
      parent: Mimic
      run: mimic_wave_one_hand_waist_yaw_large
    MimicWaveRightHandOnlyWaistYawLarge:
      parent: Mimic
      run: mimic_wave_right_hand_only_waist_yaw_large
    MimicWaveTwoHandWaistYawLarge:
      parent: Mimic
      run: mimic_wave_two_hand_waist_yaw_large
    MimicMotifectTauntMockBow:
      parent: Mimic
      run: mimic_motifect_taunt_mock_bow


state_behaviors:
  damping:
    kind: damping
    damping:
      values:
      - [3.0, 3.0, 3.0, 3.0, 3.0, 3.0] # left leg
      - [3.0, 3.0, 3.0, 3.0, 3.0, 3.0] # right leg
      - [3.0] # waist
      - [3.0, 3.0, 3.0, 3.0, 3.0] # left arm
      - [3.0, 3.0, 3.0, 3.0, 3.0] # right arm
  ready_pose:
    kind: posture
    duration: 3.0
    stiffness:
      values:
      - [100.0, 100.0, 100.0, 150.0, 40.0, 40.0] # left leg
      - [100.0, 100.0, 100.0, 150.0, 40.0, 40.0] # right leg
      - [200.0] # waist
      - [40.0, 40.0, 40.0, 40.0, 40.0] # left arm
      - [40.0, 40.0, 40.0, 40.0, 40.0] # right arm
    damping:
      values:
      - [2.0, 2.0, 2.0, 4.0, 2.0, 2.0] # left leg
      - [2.0, 2.0, 2.0, 4.0, 2.0, 2.0] # right leg
      - [5.0] # waist
      - [10.0, 10.0, 10.0, 10.0, 10.0] # left arm
      - [10.0, 10.0, 10.0, 10.0, 10.0] # right arm
    target_position:
      values:
      - [-0.18, 0.0, 0.0, 0.36, -0.18, 0.0] # left leg
      - [-0.18, 0.0, 0.0, 0.36, -0.18, 0.0] # right leg
      - [0.0] # waist
      - [0.2, 0.25, 0.0, 0.95, 0.15] # left arm
      - [0.2, -0.25, 0.0, 0.95, -0.15] # right arm
  posture_zero_pose:
