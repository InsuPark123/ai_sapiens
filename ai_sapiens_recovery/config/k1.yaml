k1_recovery:
  ros__parameters:
    execute: false
    auto_rearm: false
    rearm_mode: startup
    state_broadcasters: [joint_state_broadcaster]
    permit_topic: /ai_sapiens/recovery/permit
    controller_manager: /controller_manager
    rc_status_topic: /ai_sapiens_rc/status
    motor_components: [k1_left_arm, k1_right_arm, k1_left_leg, k1_right_leg]
    command_controller: joint_group_impedance_controller
    max_attempts: 3
    retry_backoff_sec: 2.0
    service_timeout_sec: 30.0
