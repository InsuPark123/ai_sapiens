state_machine:
  initial: Damping
  states:
    Damping:
      run: damping
      transitions:
        - when: ReadyPoseRequested
          to: ReadyPose
    ReadyPose:
      run: ready_pose
      transitions:
        - when: DampingRequested
          to: Damping
        - when: VelocityRequested
          to: Velocity
        - when: MimicRequested
          select: mimic_selector
    ZeroPose:
      run: posture_zero_pose
      transitions:
        - when: DampingRequested
          to: Damping
        - when: ReadyPoseRequested
          to: ReadyPose
        - when: VelocityRequested
          to: Velocity
        - when: MimicRequested
          select: mimic_selector
    Velocity:
      # run: velocity_policy_amp_hangang
      # run: velocity_policy_amp_hangang_limited
      # run: velocity_policy_woojin_amp_mjlab_k1_head_safe_50000
      # run: velocity_policy_walk_terrain
      # run: velocity_motifect_stable_torso_no_phase_lpf6_93400
      # run: velocity_motifect_stable_torso_no_phase_lpf6_93400_limited
      run: velocity_motifect_sharedlow_noncross_phase_nt_on_from208000_lpf6_217000_limited
      transitions:
        - when: DampingRequested
          to: Damping
        - when: ReadyPoseRequested
          to: ReadyPose
        - when: MimicRequested
          trigger: edge
          select: mimic_selector

    SubVelocityTerrain:
      run: velocity_policy_walk_terrain
      transitions:
        - when: DampingRequested
          to: Damping
        - when: ReadyPoseRequested
          to: ReadyPose
        - when: VelocityRequested
          to: Velocity

    SubVelocityHangang:
      # run: velocity_policy_amp_hangang
      # run: velocity_motifect_stable_torso_no_phase_lpf6_93400
      run: velocity_motifect_sharedlow_noncross_phase_nt_on_from208000_lpf6_217000
      transitions:
        - when: DampingRequested
          to: Damping
        - when: ReadyPoseRequested
          to: ReadyPose
        - when: VelocityRequested
          to: Velocity

    Mimic:
      abstract: true
      transitions:
        - when: DampingRequested
          to: Damping
        - when: ReadyPoseRequested
          to: ReadyPose
        - when: VelocityRequested
          to: Velocity
    MimicDance1:
      parent: Mimic
      run: mimic_dance1
    MimicDance2:
      parent: Mimic
      run: mimic_dance2
    MimicJumpNewton:
      parent: Mimic
      run: mimic_jump_newton
    MimicRedredNewton:
      parent: Mimic
      run: mimic_redred_newton
